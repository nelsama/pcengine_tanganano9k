SYMBOLS { __STACKTOP__: type=weak, value=$4000; }
MEMORY {
  ZP:  start=$0000, size=$100, type=rw;
  RAM: start=$2200, size=$1C00;
  LO:  start=$C000, size=$2000, fill=yes, fillval=$FF, file=%O;
  HI:  start=$E000, size=$1FF6, fill=yes, fillval=$FF, file=%O;
  VEC: start=$FFF6, size=10, file=%O;
}
SEGMENTS {
  ZEROPAGE: load=ZP,  type=zp;
  STARTUP:  load=HI,  type=ro;
  CODE:     load=LO,  type=ro;
  LOWCODE:  load=LO,  type=ro, optional=yes;
  RODATA:   load=HI,  type=ro;
  ONCE:     load=HI,  type=ro, optional=yes;
  FATCODE:  load=HI,  type=ro, optional=yes;
  DATA:     load=HI,  run=RAM, type=rw, define=yes;
  BSS:      load=RAM, type=bss, define=yes;
  VECTORS:  load=VEC, type=ro;
}
